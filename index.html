<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Modeling Room</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 5px;
            z-index: 100;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div id="loading">Loading 3D Room...</div>
    <div id="info">
        <h3>3D Modeling Room</h3>
        <p>🖱️ Left Click + Drag: Rotate view</p>
        <p>🖱️ Right Click + Drag: Pan</p>
        <p>🖱️ Scroll: Zoom in/out</p>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);
        scene.fog = new THREE.Fog(0x1a1a1a, 10, 50);

        // Camera setup
        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 3, 8);

        // Renderer setup
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 3;
        controls.maxDistance = 20;
        controls.maxPolarAngle = Math.PI / 2 - 0.1; // Prevent camera from going below floor

        // Texture loader
        const textureLoader = new THREE.TextureLoader();
        const loadingManager = new THREE.LoadingManager();

        loadingManager.onLoad = () => {
            document.getElementById('loading').style.display = 'none';
        };

        // Room dimensions
        const roomWidth = 12;
        const roomHeight = 6;
        const roomDepth = 12;

        // Load textures
        const floorTexture = textureLoader.load('WechatIMG541.jpg');
        const wallTexture = textureLoader.load('WechatIMG542.jpg');

        // Configure texture wrapping and repeat
        floorTexture.wrapS = THREE.RepeatWrapping;
        floorTexture.wrapT = THREE.RepeatWrapping;
        floorTexture.repeat.set(4, 4);

        wallTexture.wrapS = THREE.RepeatWrapping;
        wallTexture.wrapT = THREE.RepeatWrapping;
        wallTexture.repeat.set(3, 2);

        // Create floor
        const floorGeometry = new THREE.PlaneGeometry(roomWidth, roomDepth);
        const floorMaterial = new THREE.MeshStandardMaterial({
            map: floorTexture,
            side: THREE.DoubleSide
        });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = 0;
        floor.receiveShadow = true;
        scene.add(floor);

        // Create walls
        // Back wall
        const backWallGeometry = new THREE.PlaneGeometry(roomWidth, roomHeight);
        const backWallMaterial = new THREE.MeshStandardMaterial({
            map: wallTexture.clone(),
            side: THREE.DoubleSide
        });
        backWallMaterial.map.repeat.set(3, 2);
        const backWall = new THREE.Mesh(backWallGeometry, backWallMaterial);
        backWall.position.set(0, roomHeight / 2, -roomDepth / 2);
        backWall.receiveShadow = true;
        scene.add(backWall);

        // Left wall
        const leftWallGeometry = new THREE.PlaneGeometry(roomDepth, roomHeight);
        const leftWallMaterial = new THREE.MeshStandardMaterial({
            map: wallTexture.clone(),
            side: THREE.DoubleSide
        });
        leftWallMaterial.map.repeat.set(3, 2);
        const leftWall = new THREE.Mesh(leftWallGeometry, leftWallMaterial);
        leftWall.rotation.y = Math.PI / 2;
        leftWall.position.set(-roomWidth / 2, roomHeight / 2, 0);
        leftWall.receiveShadow = true;
        scene.add(leftWall);

        // Right wall
        const rightWallGeometry = new THREE.PlaneGeometry(roomDepth, roomHeight);
        const rightWallMaterial = new THREE.MeshStandardMaterial({
            map: wallTexture.clone(),
            side: THREE.DoubleSide
        });
        rightWallMaterial.map.repeat.set(3, 2);
        const rightWall = new THREE.Mesh(rightWallGeometry, rightWallMaterial);
        rightWall.rotation.y = -Math.PI / 2;
        rightWall.position.set(roomWidth / 2, roomHeight / 2, 0);
        rightWall.receiveShadow = true;
        scene.add(rightWall);

        // Front wall (partial, to see inside)
        const frontWallGeometry = new THREE.PlaneGeometry(roomWidth, roomHeight);
        const frontWallMaterial = new THREE.MeshStandardMaterial({
            map: wallTexture.clone(),
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.3
        });
        frontWallMaterial.map.repeat.set(3, 2);
        const frontWall = new THREE.Mesh(frontWallGeometry, frontWallMaterial);
        frontWall.rotation.y = Math.PI;
        frontWall.position.set(0, roomHeight / 2, roomDepth / 2);
        scene.add(frontWall);

        // Ceiling (optional)
        const ceilingGeometry = new THREE.PlaneGeometry(roomWidth, roomDepth);
        const ceilingMaterial = new THREE.MeshStandardMaterial({
            color: 0xcccccc,
            side: THREE.DoubleSide
        });
        const ceiling = new THREE.Mesh(ceilingGeometry, ceilingMaterial);
        ceiling.rotation.x = Math.PI / 2;
        ceiling.position.y = roomHeight;
        scene.add(ceiling);

        // Lighting
        // Ambient light
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        // Main directional light
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 5);
        directionalLight.castShadow = true;
        directionalLight.shadow.camera.left = -10;
        directionalLight.shadow.camera.right = 10;
        directionalLight.shadow.camera.top = 10;
        directionalLight.shadow.camera.bottom = -10;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        scene.add(directionalLight);

        // Point light in the center
        const pointLight = new THREE.PointLight(0xffffff, 0.6);
        pointLight.position.set(0, roomHeight - 1, 0);
        pointLight.castShadow = true;
        scene.add(pointLight);

        // Add some sample objects in the room
        // Cube
        const cubeGeometry = new THREE.BoxGeometry(1, 1, 1);
        const cubeMaterial = new THREE.MeshStandardMaterial({ color: 0xff6347 });
        const cube = new THREE.Mesh(cubeGeometry, cubeMaterial);
        cube.position.set(-2, 0.5, -2);
        cube.castShadow = true;
        cube.receiveShadow = true;
        scene.add(cube);

        // Sphere
        const sphereGeometry = new THREE.SphereGeometry(0.7, 32, 32);
        const sphereMaterial = new THREE.MeshStandardMaterial({ color: 0x4682b4 });
        const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
        sphere.position.set(2, 0.7, -2);
        sphere.castShadow = true;
        sphere.receiveShadow = true;
        scene.add(sphere);

        // Cylinder
        const cylinderGeometry = new THREE.CylinderGeometry(0.5, 0.5, 2, 32);
        const cylinderMaterial = new THREE.MeshStandardMaterial({ color: 0x32cd32 });
        const cylinder = new THREE.Mesh(cylinderGeometry, cylinderMaterial);
        cylinder.position.set(0, 1, 2);
        cylinder.castShadow = true;
        cylinder.receiveShadow = true;
        scene.add(cylinder);

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            // Rotate objects slowly
            cube.rotation.x += 0.01;
            cube.rotation.y += 0.01;
            sphere.rotation.y += 0.005;
            cylinder.rotation.y += 0.01;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
